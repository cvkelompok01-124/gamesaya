<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Bakti Pelajar</title>
    <style>
        body { 
            text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #e0e7ff; margin: 0; overflow: hidden;
        }
        /* Style untuk Menu & Layar */
        .screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; width: 100%; position: absolute; top: 0; left: 0;
        }
        .hidden { display: none !important; }

        h1 { color: #4338ca; font-size: 3rem; margin-bottom: 10px; }
        .btn {
            padding: 15px 40px; font-size: 1.2rem; background: #4f46e5;
            color: white; border: none; border-radius: 50px; cursor: pointer;
            transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:hover { background: #3730a3; transform: scale(1.1); }

        /* Style Game */
        #box { 
            width: 60px; height: 60px; background: #ef4444; 
            position: absolute; cursor: pointer; border-radius: 12px;
            box-shadow: 0 5px 0 #b91c1c;
        }
        #hud { 
            position: absolute; top: 20px; width: 100%; 
            display: flex; justify-content: space-around; font-size: 1.5rem; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="start-screen" class="screen">
        <h1>Bakti Pelajar Game</h1>
        <p>Klik kotak merah sebanyak mungkin sebelum waktu habis!</p>
        <button class="btn" onclick="startGame()">MULAI MAIN</button>
    </div>

    <div id="game-screen" class="screen hidden">
        <div id="hud">
            <div>Skor: <span id="score">0</span></div>
            <div>Waktu: <span id="timer">30</span>s</div>
        </div>
        <div id="box"></div>
    </div>

    <div id="over-screen" class="screen hidden">
        <h1>Waktu Habis!</h1>
        <p style="font-size: 1.5rem;">Skor Akhir Kamu: <span id="final-score">0</span></p>
        <button class="btn" onclick="showMenu()">KEMBALI KE MENU</button>
    </div>
