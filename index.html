<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Game Klik Saya!</title>
    <style>
        body { text-align: center; font-family: Arial; background: #f0f0f0; }
        #box { width: 50px; height: 50px; background: red; position: absolute; cursor: pointer; border-radius: 5px; }
        #score { font-size: 24px; color: #333; }
    </style>
</head>
<body>
    <h1>Game Klik Kotak Merah!</h1>
    <p id="score">Skor: 0</p>
    <div id="box"></div>

    <script>
        let score = 0;
        const box = document.getElementById('box');
        const scoreDisplay = document.getElementById('score');

        function moveBox() {
            const x = Math.random() * (window.innerWidth - 50);
            const y = Math.random() * (window.innerHeight - 150) + 100;
            box.style.left = x + 'px';
            box.style.top = y + 'px';
        }

        box.addEventListener('click', () => {
            score++;
            scoreDisplay.innerText = "Skor: " + score;
            moveBox();
        });

        moveBox(); // Gerakan pertama saat game dimulai
    </script>
</body>
</html>
