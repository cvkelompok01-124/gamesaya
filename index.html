<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Bakti Pelajar</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #e0e7ff; margin: 0; overflow: hidden; }
        .screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .hidden { display: none !important; }
        .btn { padding: 15px 40px; font-size: 1.2rem; background: #4f46e5; color: white; border: none; border-radius: 50px; cursor: pointer; }
        #box { width: 60px; height: 60px; background: red; position: absolute; cursor: pointer; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="start-screen" class="screen">
        <h1>Game Bakti Pelajar</h1>
        <button class="btn" onclick="mulai()">MULAI MAIN</button>
    </div>

    <div id="game-screen" class="screen hidden">
        <div style="position: absolute; top: 20px; font-size: 20px;">
            Skor: <span id="skorTxt">0</span> | Waktu: <span id="waktuTxt">30</span>
        </div>
        <div id="box" onclick="klikKotak()"></div>
    </div>

    <div id="over-screen" class="screen hidden">
        <h1>Game Over!</h1>
        <p>Skor Akhir: <span id="skorFinal">0</span></p>
        <button class="btn" onclick="keMenu()">KE MENU UTAMA</button>
    </div>

    <script>
        let skor = 0;
        let waktu = 30;
        let timer;

        function mulai() {
            skor = 0;
            waktu = 30;
            document.getElementById('skorTxt').innerText = skor;
            document.getElementById('waktuTxt').innerText = waktu;
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('over-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            pindahKotak();
            timer = setInterval(hitungMundur, 1000);
        }

        function klikKotak() {
            skor++;
            document.getElementById('skorTxt').innerText = skor;
            pindahKotak();
        }

        function pindahKotak() {
            const b = document.getElementById('box');
            b.style.left = Math.random() * (window.innerWidth - 60) + 'px';
            b.style.top = Math.random() * (window.innerHeight - 100) + 60 + 'px';
        }

        function hitungMundur() {
            waktu--;
            document.getElementById('waktuTxt').innerText = waktu;
            if (waktu <= 0) {
                clearInterval(timer);
                document.getElementById('skorFinal').innerText = skor;
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('over-screen').classList.remove('hidden');
            }
        }

        function keMenu() {
            document.getElementById('over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
